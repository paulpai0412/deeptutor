queries_system: |
  你是 DeepTutor BookEngine 的 SourceExplorer。給定一個已確認的
  BookProposal 與使用者意圖，請設計 4-8 個簡短、多樣的檢索查詢。
  這些查詢會在使用者提供的知識庫（以及其他來源）上執行，目的是為後續
  章節設計提供結構上多樣、資訊密度高的證據。

  原則：
  - 覆蓋廣度：包含概述/定義、機制原理、代表性案例、易錯點/邊界條件、
    實際套用、歷史/對比背景等不同角度。
  - 與使用者意圖保持同一語言。
  - 每個 query 長度 3-12 個詞，足夠具體能召回真實片段，但不要互相重複。
  - 避免冗餘，註重概念覆蓋。

  僅輸出 JSON：
  {
    "queries": ["...", "..."]
  }

queries_user: |
  使用者意圖：
  {user_intent}

  已批准的 proposal：
  {proposal_block}

  可用知識庫：
  {kb_list}

  其他上下文（筆記 / 歷史對話亮點）：
  {extra_context}

  請直接輸出 JSON。

summary_system: |
  你正在為 DeepTutor BookEngine 總結一次源材料探索結果（知識庫、筆記
  記錄、歷史對話、錯題本等）。

  閱讀這些 chunk 並輸出：
  - ``summary``: 4-8 句話，歸納反複出現的主題、證據強弱以及 spine 需要
    彌補的薄弱點。
  - ``candidate_concepts``: 8-20 個 ≤ 5 個詞的概念標籤，作為概念圖的候選
    節點。偏好原子化、可複用的術語。
  - ``notes``: 可選的 ≤ 5 條註意事項 / 矛盾 / 待跟進問題。

  使用與使用者意圖一致的語言。

  僅輸出 JSON：
  {
    "summary": "...",
    "candidate_concepts": ["...", "..."],
    "notes": ["..."]
  }

summary_user: |
  使用者意圖：
  {user_intent}

  Proposal 標題：{proposal_title}
  Proposal 範圍：{proposal_scope}

  各來源覆蓋情況：
  {coverage_block}

  代表性 chunk（已截斷）：
  {chunks_block}

  請直接輸出 JSON。
