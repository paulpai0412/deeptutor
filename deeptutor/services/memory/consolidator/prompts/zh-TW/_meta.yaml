# 每個 surface / slot 的焦點 + 推薦 section（中文）。

surfaces:
  chat:
    focus: "使用者呈現出的穩定誤解、已經顯示出掌握的概念、以及反複回到的持久話題。剔除單回合閒聊。"
    sections: ["誤解", "掌握", "話題"]
  notebook:
    focus: "筆記中反複出現的主題、使用者偏好的格式、以及反複出現的問題。"
    sections: ["主題", "格式", "懸而未決的問題"]
  quiz:
    focus: "答題中的錯誤模式、正確率高/低的話題、使用者在哪類題型上掙扎。"
    sections: ["錯誤模式", "強項", "弱項"]
  kb:
    focus: "使用者的檔案興趣、對知識庫的查詢模式、文獻庫中的空白。"
    sections: ["興趣", "高頻查詢", "文獻庫空白"]
  book:
    focus: "閱讀節奏、卡點（頁面重複開啟或停留）、使用者重點標註的主題。"
    sections: ["節奏", "卡點", "標註主題"]
  partner:
    focus: "夥伴對話中反複出現的主題、不同頻道的行為差異。"
    sections: ["主題", "頻道"]
  cowriter:
    focus: "寫作風格偏好、反複修改的模式、使用者起草的話題。"
    sections: ["風格", "反複修改", "話題"]

slots:
  recent:
    focus: "最近 1-4 周使用者跨 surface 的活動滾動時間線。時間錨定、surface 歸屬。"
    sections: ["本週", "更早"]
  profile:
    focus: "持久的身份、學習風格、知識水平。只接受多個 surface 多個 L2 條目支撐的判斷，禁止臆測。"
    sections: ["身份", "學習風格", "知識水平"]
  scope:
    focus: "使用者有過實際接觸的概念，含信心標籤（熟悉 / 練習中 / 不確定），均繫結 L2 證據。"
    sections: ["熟悉", "練習中", "不確定"]
