short_description: "把使用者顯式表達的偏好寫入長期記憶。僅當使用者**明確表達**偏好時才呼叫。"
when_to_use: "使用者明確告訴你一個偏好——風格、語言、格式、深度、跟進節奏，任何他們希望長期沿用的東西。不要猜，不要根據一句可能只是當時情境的話推斷長期偏好。"
input_format: "{\"op\": \"add\"|\"edit\", \"text\": \"≤240 字，儘量用使用者原話\", \"target_id\"?: \"edit 時必填 m_xxx\", \"reason\"?: \"可選備註\"}"
guideline: "在回覆裡簡短複述偏好（例如「好的，之後用簡短回答」），然後呼叫本工具。自然時優先使用者原話引述。一次呼叫記一條偏好，不要塞多個無關偏好到同一 text。"
note: "只能寫 L3 偏好檔案。其他記憶層（近期總結、畫像、scope、各 surface 小結）由使用者在 Memory 工作臺手動凝練——不要嘗試寫。"
phase: "execution"
