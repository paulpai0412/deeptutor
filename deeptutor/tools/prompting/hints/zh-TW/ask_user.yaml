short_description: "暫停 loop 向使用者提 1-4 個澄清問題，所有問題在同一張卡片上展示並可切換；每題給 2-4 個可點選項（label + description），自由輸入由卡片自動提供。"
when_to_use: "僅在你被一個**只有使用者才能拍板的決定**卡住時使用——即無法從請求本身、對話上下文、附件材料或合理預設值推出答案（如：使用者水平/年級不明且會改變講解深度、問題指代不清、幾條合理路徑差異實質性大）。**不要**用它來問『要不要繼續？』、確認使用者已經說過的話、或有顯然常規答案的選擇——直接採用常規答案、在回覆裡說明即可。**同一次回覆裡最多呼叫一次 `ask_user`**：把所有要澄清的問題打包進同一次呼叫的 `questions` 列表（最多 4 個），**絕不要**並行發起多個 `ask_user`——重複的卡片是錯誤，不是冗餘。"
input_format: |
  {"intro": "可選的一行導語", "questions": [
    {"id": "audience", "header": "受眾", "prompt": "這份內容是講給誰的？",
     "options": [
       {"label": "高中生（推薦）", "description": "直觀講解，避免大學數學符號"},
       {"label": "本科生", "description": "包含推導和形式化定義"},
       {"label": "研究者", "description": "直接給結論與前沿引用"}
     ]},
    {"id": "focus", "header": "側重", "prompt": "想側重哪些方面？（可多選）", "multi_select": true,
     "options": [{"label": "直覺理解"}, {"label": "公式推導"}, {"label": "套用例子"}]}
  ]}
  規則：每題給 2-4 個互斥且有區分度的選項——`label` 要短（1-5 個詞），把選了它意味著什麼寫進 `description`。如果你有推薦項，放在**第一個**並在 label 末尾加「（推薦）」。選項可疊加時設 `multi_select: true`，並把問題措辭改成多選語氣。`header` 是極短的標籤頁標題（最多 12 字元）。**絕不要**自己加「其他」選項——卡片會自動提供自由輸入。
guideline: "呼叫後 loop **暫停**等使用者回覆，然後在**同一回合**自動 resume——你會在下一次迭代看到一條以 `User answered:` 開頭的工具結果，下方按 `- <prompt>\\n  → <answer>` 每行一條列出（多選的回答以逗號連線）。看到它後，**必須**繼續處理使用者最初的請求：需要的話再調更多工具，最後用一個有實質內容的 ``FINISH`` 結尾。**絕不**把 ask_user 當作本回合的終點——一句簡單的『好的我知道了』不算合格的最終答案。"
note: "使用者跳過的問題會以 `(skipped)` 回傳。使用者也可能不點選項而自由輸入——以其輸入為準。使用者也可以點 stop 按鈕取消等待（會取消整回合）。"
phase: "exploration"
