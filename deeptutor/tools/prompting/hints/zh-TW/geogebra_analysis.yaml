short_description: "分析數學題目圖片，產生經過驗證的 GeoGebra 指令用於幾何視覺化。"
when_to_use: "當使用者上傳了幾何或數學配圖，並希望在 GeoGebra 中重建、視覺化或互動操作圖形時使用。"
input_format: "數學題目文字（question）。圖片由附件自動註入。"
guideline: "僅當有圖片附件且題目涉及幾何圖形時呼叫此工具。工具內部執行完整的 4 階段流水線（檢測→分析→指令碼產生→反思驗證），回傳可直接渲染的 GeoGebra 指令。當工具回傳的結果中包含 ```ggbscript[…]``` 圍欄程式碼塊時，必須在最終回答中原樣複製該完整程式碼塊，前端才能據此渲染可互動的幾何圖形。"
note: "流水線需要支援視覺的 LLM。由於包含四次連續 LLM 呼叫，處理時間約 15-30 秒。"
phase: "exploration"
