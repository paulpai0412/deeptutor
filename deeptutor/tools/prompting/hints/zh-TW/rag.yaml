short_description: "在使用者掛載的某個知識庫中檢索相關內容。"
when_to_use: "當答案大機率來自使用者掛載的知識庫（定義、公式、概念說明、教材內容）時使用。"
input_format: "{\"query\": \"非空自然語言查詢\", \"kb_name\": \"掛載的某個知識庫名稱\"}。"
guideline: "課程材料相關的問題優先用 RAG。需要查多個知識庫時，按 kb_name 分別多次呼叫（系統會並行執行）。"
note: "query 不能為空；如果第一次檢索效果不佳，換個查詢角度再判斷是否無結果。"
phase: "exploration"
