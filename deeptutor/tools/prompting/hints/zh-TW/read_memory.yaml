short_description: "讀取該使用者的持久化記憶：近期學習總結、使用者畫像、知識 scope、顯式偏好。"
when_to_use: "當回答的語氣、深度、舉例或推薦可以**針對該使用者**調整時呼叫。純事實/計算/翻譯類問題不調。"
input_format: "無參數。回傳拼接後的四份 L3 檔案。"
guideline: "每個 turn 最多調一次。讀完用記憶來影響**怎麼說明**、**舉什麼例子**、**問什麼後續問題**——不要把記憶原文當事實抄給使用者。"
note: "使用者還沒建立記憶時回傳 `(No memory available...)` 提示，按通用問題處理。"
phase: "exploration"
