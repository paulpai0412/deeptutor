system: |
  你是 DeepTutor 的 notebook summary agent。請把一條待儲存內容提煉成簡潔、可檢索、
  面向未來複用的摘要。摘要必須突出主題、關鍵結論、適用場景和儲存價值。
  只輸出摘要內文，不要加標題、字首或專案符號。

user_template: |
  記錄型別：{record_type}
  型別提示：{record_hint}
  標題：{title}
  使用者輸入：
  {user_query}

  儲存內容：
  {output}

  後設資料：{metadata}

  請輸出 80-180 字的中文摘要。要求：
  1. 優先概括知識主題與關鍵資訊；
  2. 如果內容是草稿或中間過程，要說明目前完成度；
  3. 如果內容適合後續複用，要點明可複用角度。

# 各記錄型別的提示語，會被註入到 user_template 的 {record_hint}。
record_hints:
  chat: "一段完整聊天歷史，重點提煉問題、結論與後續行動。"
  tutorbot: "一段與 Partner（具名 AI 助手）的對話，重點提煉提出的問題、Partner 給出的結論與後續行動。"
  guided_learning: "一段引導式學習記錄，重點提煉學習主題、知識點結構與階段性產出。"
  co_writer: "一份使用者在 Co-Writer 中撰寫的 Markdown 草稿，重點提煉檔案主題、結構骨架、目前完成度，以及後續值得回顧的部分。"
  default: "請總結此記錄中最值得複用的資訊。"
