  tool_result_snipped: "[較早的工具結果已裁剪以保持在上下文視窗內；如果仍需要該內容，請再次呼叫同一工具]"
  ask_user_resolved_directive: "[ask_user 已解決。請使用這些回答繼續處理使用者的原始請求。不要只回覆確認。]"
  too_many_tool_calls: "模型請求了 {requested} 個工具，單回合最多並行執行 {limit} 個，已截斷。"
  tool_unknown_error: "執行工具 {tool} 時發生未知錯誤。"
  start_retrieval: "開始檢索"
  empty_tool_result: "工具執行完成，但沒有回傳文字內容。"
  loop_budget_exhausted: "探索回合預算已用盡，將基於已收集的材料作答。"
  loop_error_finish: "某一步執行失敗，將基於已收集的材料作答。"
  context_window_guard: "已裁剪較舊的工具結果，以確保本回合在模型上下文視窗內。"
  tool_schema_fallback: "服務方拒絕了原生工具 schema；將不帶工具重試。"
  image_fallback: "目前模型不支援圖片輸入；將去除圖片後重試。"
