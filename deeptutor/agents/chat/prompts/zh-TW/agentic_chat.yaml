  empty_finish_nudged: "模型這一回合只有內部推理，已提示其繼續執行。"

empty:
  empty_reply: "（空回覆）"
  skipped_reply: "（已跳過）"
  question_fallback: "（問題）"
  user_answered: "使用者回答："
  no_tool_traces: "本回合沒有實際工具呼叫。"
  no_intermediate_trace: "沒有可用的中間執行記錄。"
