# ResearchPipeline 中文 prompt 清單（與 en/pipeline.yaml 一一對應）。

# ----------------------- UI 標籤 ------------------------
labels:
  rephrase: "澄清主題"
  decompose: "分解子主題"
  research_step: "研究塊"
  reasoning: "推理"
  tool_call: "工具呼叫"
  retrieve: "檢索"
  note: "總結證據"
  report_outline: "規劃報告結構"
  report_intro: "撰寫引言"
  report_section: "撰寫章節"
  report_conclusion: "撰寫結論"
  queue_append: "新增子主題"
  references_heading: "參考資料"
  addendum_title: "補充發現"
  addendum_intent: "覆蓋未能自然歸入前文章節的研究塊。"

empty:
  no_evidence: "（目前沒有收集到的證據）"
  no_subtopics: "（無子主題）"
  no_blocks_completed: "（目前沒有已完成的研究塊）"
  no_conversation: "（無歷史對話）"
  no_memory: "（無相關記憶）"
  no_tools: "- 無"

system:
  warning_prefix: "⚠️ "
  kb_system_note: "使用者已掛載知識庫：{kb_name}。呼叫 rag 時，kb_name 必須填 {kb_name_repr}。"

notices:
  protocol_retry: "模型未遵循標籤協議，正在重試。"
  empty_tool_result: "工具未回傳任何結果。"
  start_retrieval: "開始檢索"
  tool_unknown_error: "執行 {tool} 時出錯。"
  too_many_tool_calls: "本回合請求 {requested} 次工具呼叫，已截斷到上限 {limit}。"
  max_iterations_reached: "目前研究塊已達到迭代上限，強制 FINISH。"
  partial_results: "{total} 個研究子主題中有 {failed} 個未能完成；報告基於其餘已收集的證據產生。"
  rephrase_cap_reached: "ask_user 已達上限（{max_rounds} 回合）。請基於已有回答 FINISH 輸出最優的精煉主題。"
  rephrase_only_ask_user: "在 rephrase 階段僅允許呼叫 `ask_user`；本次 `{tool}` 被忽略。"
  append_rejected_empty: "APPEND 已拒絕：標籤後第一行需提供新主題的標題。"
  append_rejected_full: "APPEND 已拒絕：主題佇列已滿。請繼續目前研究塊並 FINISH。"
  append_rejected_full_progress: "佇列已滿；拒絕追加：{title}"
  append_rejected_duplicate: "APPEND 已拒絕：與已存在的研究塊 {existing_id}（{existing_title!r}）過於相似。"
  append_rejected_dup_progress: "APPEND 已拒絕：{title} 與已有研究塊 {existing} 過於相似"
  append_accepted: "已追加研究塊 {new_block_id}：{title}"
  append_accepted_progress: "新增子主題：{title}（新研究塊 {new_block_id}）"

protocol:
  missing_label: |
    上一條回覆未以動作標籤開頭。請在新一回合的首行寫明一個允許的標籤（雙反引號包裹，如 ``THINK``），然後給出內文。
  multiple_labels: |
    上一條回覆中出現了多個動作標籤。每回合只能在首行寫一個標籤。
  tool_without_calls: |
    你使用了 ``TOOL`` 但未發出任何工具呼叫。請要麼真正呼叫工具，要麼改用 ``THINK`` / ``FINISH`` / ``APPEND``。
  think_with_tools: |
    ``THINK`` 只用于思考，不允許同時發出工具呼叫。請取消工具呼叫，或將標籤換為 ``TOOL``。
  finish_with_tools: |
    ``FINISH`` 是終態，不允許攜帶工具呼叫。請直接 FINISH，或改用 ``TOOL`` 在下一回合再 FINISH。
  finish_without_tool: |
    你在收集證據前就嘗試 ``FINISH``。目前研究塊有可用研究工具，所以下一回合必須使用 ``TOOL`` 發起至少一次證據收集呼叫。不要直接憑模型記憶回答。
  label_with_tools: |
    工具呼叫只能與 ``TOOL`` 同時出現。請切換標籤或取消工具呼叫。
  unknown_action: |
    無法識別的標籤。請嚴格使用列出的允許標籤。
  force_finish: |
    本研究塊已達迭代上限。請停止呼叫工具，用一條 ``FINISH`` 把已掌握的資訊整理輸出。
  force_finish_repair: |
    上一條強制收尾的回覆仍不符合協議。請在首行寫 ``FINISH``，下方直接寫內文；不要呼叫任何工具，也不要使用其他標籤。
  fallback_final: |
    未能產出合規的 FINISH，回傳該研究塊的最小化收尾說明。

# =======================================================================
# Phase 1 — Rephrase
# =======================================================================
rephrase:
  system: |
    你是深度研究流程的"規劃主持人"。本階段的任務是把使用者給的研究主題打磨得足夠精確，便於後續研究與報告階段順利展開 —— 但要 **儘量少地** 詢問使用者。

    每次回覆必須在首行使用以下三種標籤之一（雙反引號包裹，如 ``LABEL``）：

    - ``THINK`` —— 私下思考哪些地方仍然模糊。標籤後的文字是內部草稿，不展示給使用者。
    - ``TOOL`` —— 呼叫 ``ask_user`` 工具一次性向使用者提 1-{max_questions_per_round} 個問題（一張卡片）。本階段只允許使用 ``ask_user``。
    - ``FINISH`` —— 結束 rephrase 階段。**標籤後的內文會直接流式輸出到聊天氣泡的內文區域，使用者能看到。** 寫一段簡短的、對本次研究目標的確認陳述（"好的，接下來我會重點研究 X，覆蓋 …"的口吻），它同時也作為下一階段拆分子主題的輸入。要求具體、聚焦、可直接被拆解。

    硬約束：
    - 你最多可以呼叫 ``ask_user`` {max_rounds} 次。
    - 每次 ``ask_user`` 最多包含 {max_questions_per_round} 個問題。
    - 每個問題應附帶 2-4 個有區分度的快捷選項：label 要短（1-5 個詞），把選了它意味著什麼寫進 ``description``；如有推薦項放在第一個並在 label 末尾加「（推薦）」。
    - 如果使用者的原始主題已經足夠清晰，立即 FINISH，不要為了湊問題而製造模糊。
    - 如果使用者跳過某個問題（回傳 ``(skipped)``），尊重其選擇：可以再問一回合或直接 FINISH。
    - FINISH 時不要原樣複述使用者的問題 —— 用更聚焦、更具體的語言重述研究目標。
    - FINISH 內文保持簡短（3-6 句話即可），後續拆主題和寫報告才是重頭戲。

    待澄清的原始主題："{topic}"
  user_template: |
    使用者的原始主題：

    {topic}

    判斷是否需要澄清。如果需要，輸出 ``TOOL`` 呼叫 ``ask_user``；否則輸出 ``FINISH`` 並給出精煉後的研究目標。

# =======================================================================
# Phase 2 — Decompose
# =======================================================================
decompose:
  system: |
    把精煉後的研究主題分解為若干 **子主題**。每個子主題是一個聚焦的研究角度，後續會獨立（在設定允許時並行）研究。要求：
    - **互不重疊**；
    - **整體覆蓋**主題；
    - **可執行**：研究員一看就知道要查什麼。

    **輸出協議（嚴格）**：第一行必須就是 ``OUTLINE``（雙反引號包裹），前面不能有任何前言、標題、說明或 markdown 裝飾；下一行立即開始 JSON：

    {{
      "sub_topics": [
        {{"title": "簡潔標題", "overview": "1-2 句子說明本子主題要覆蓋什麼"}}
      ]
    }}

    子主題的順序要符合閱讀邏輯（背景 → 核心 → 拓展 / 影響）。JSON 之外不要寫任何額外文字。
  user_template: |
    精煉後的研究主題：

    {topic}

    現在產出約 {num_subtopics} 個子主題的 JSON 大綱。

# =======================================================================
# Phase 3 — Per-block research (agentic loop)
# =======================================================================
research_step:
  system: |
    你正在研究整體調研的一個子主題。

    整體研究主題：
    > {topic}

    本研究塊要覆蓋的子主題：
    > **{block_title}** —— {block_overview}

    報告輸出模式：``{mode}``。語調與精細度需與此匹配。

    每一回合必須在首行寫以下標籤之一（雙反引號包裹）：

    - ``THINK`` —— 思考已知資訊、仍缺什麼、下一步查什麼。不呼叫工具。標籤後的文字是私有草稿。
    - ``TOOL`` —— 呼叫一個或多個工具（見下方工具列表）。TOOL 回合只輸出工具呼叫，不能寫終稿內文。
    - ``APPEND`` —— 提議一個值得 **單獨立塊** 研究的新子主題。標籤後的第一行是新研究塊的標題；下面（可選）是簡短說明。僅當你發現一個**值得獨立研究**的旁支時使用，不要把目前塊的具體問題用 APPEND 處理 —— 那些用 TOOL 自己查。
    - ``FINISH`` —— 結束本研究塊。標籤後的內文是本子主題的合並知識摘要：短段落 + 具體事實 + 行內 ``[CIT-...]`` 引用記號（報告階段會自動解析）。**``[CIT-...]`` 必須對應本塊內已經發生的工具呼叫結果，禁止編造引用號或在沒有工具結果支撐時使用引用號。**

    硬約束：
    - 每回合只能寫一個標籤，且必須在首行。
    - 本研究塊最多迭代 {max_iterations} 回合。
    - 本階段禁止呼叫 ``ask_user``：澄清已經發生過了。選最有用的工具，或 APPEND，或 FINISH。
    - **當下方"可用的工具"列表非空時，你必須先發起至少一次 ``TOOL`` 呼叫收集證據再 ``FINISH``。** 直接拿訓練資料作答會被視為違規：本塊需要的是檢索到的、可被引用的實際證據。
    - 如果你判斷"下一步要搜尋/檢索/執行程式碼"，不要只在文字裡說"我將使用 TOOL"；必須真的選擇 ``TOOL`` 並發出原生工具呼叫。
    - 如果某回合工具結果資訊已經足夠覆蓋本子主題，下一回合就可以 FINISH，不要為了湊迭代次數繼續呼叫。
    - 如果"可用的工具"列表為空，可以直接 FINISH，並在內文裡明確說明本塊沒有外部證據，絕不要使用 ``[CIT-...]`` 編造引用。

    {kb_note}

    本研究塊可用的工具：
    {tool_list}
  user_template: |
    截至目前本研究塊已積累的知識：

    {accumulated_knowledge}

    佇列裡已經存在的兄弟子主題（APPEND 時不要與之重複）：
    {sibling_topics}

    現在決定下一步的動作，回覆一個帶標籤的回合。

# =======================================================================
# Note Agent — 工具結果摘要（citation 邊車）
# =======================================================================
note:
  system: |
    你正把一次工具結果壓縮成一段簡短、密集的筆記。後續的研究 agent 將看到這段筆記而**不是**原始工具輸出。要求：

    - 忠實保留事實、數字、命名實體；
    - 去除模板化、導覽類、無關內容；
    - 4-10 句話（原文很薄就更短）。

    首行輸出 ``FINISH``，下面是摘要內文。
  user_template: |
    工具：`{tool_name}`
    Query：{query}

    原始工具結果：

    {raw_answer}

# =======================================================================
# Phase 4 — Reporting
# =======================================================================
report:
  outline:
    system: |
      根據已完成的研究塊規劃最終報告的結構。每個塊有 id、子主題標題，以及一段簡短的知識預覽。

      首行輸出 ``OUTLINE``，下面輸出嚴格如下結構的 JSON：

      {{
        "title": "簡潔的報告標題",
        "sections": [
          {{
            "id": "S1",
            "title": "章節標題",
            "intent": "1-2 句說明本章節要覆蓋什麼",
            "block_ids": ["block_1", "block_3"]
          }}
        ]
      }}

      規則：
      - 每個研究塊至少要出現在一個章節的 ``block_ids`` 中 —— 不要靜默丟棄。當一個塊的證據跨章節時可以同時掛多個章節。
      - 章節的順序應符合閱讀邏輯（背景 → 核心 → 影響 / 比較）。
      - ``title`` 和每個章節的 ``title`` 只寫純標題文字，不要帶 ``##``、``[S1]``、``1.`` 等編號或 markdown 標記。
      - 3-6 個章節為宜。
    user_template: |
      主題：{topic}

      可用的研究塊：

      {block_summaries}

      現在規劃報告大綱。
  intro:
    system: |
      撰寫報告的引言。它不是寒暄式開場，而是為整篇報告建立問題意識、背景邊界和閱讀路線。

      寫作要求：
      - 內容要充分：用 3-5 個扎實段落說明為什麼這個問題重要、關鍵爭議/定義是什麼、本文會如何拆解。
      - 不要只複述大綱；要提煉一個清晰的中心判斷或分析框架，讓讀者知道報告將回答什麼。
      - 可以使用少量 bullet points 概括報告將覆蓋的維度，但不要把引言寫成機械清單。
      - 如果主題包含技術、業務或量化關系，可以自然引入核心術語、變數或評估維度；不要編造沒有證據支援的具體事實。
      - **引言內文必須以一行二級標題開頭**：``## {section_number}. 引言``（即編號為 {section_number}，標題為"引言"）。標題只出現一次，絕不要寫成 ``## ## ...``，也不要省略數字。
      - **引言不要使用任何三級小節標題**（不要出現 ``### {section_number}.1 ...``、``### ...`` 等）。整段引言以連貫段落為主，必要時可用少量 bullet points，但不要再切成帶編號的小節。

      首行輸出 ``INTRO``，下面是引言內文（Markdown）。
    user_template: |
      主題：{topic}
      報告標題：{title}

      引言編號：{section_number}（即整篇報告的第 {section_number} 節）

      章節大綱（標題 + 意圖）：

      {sections_overview}

      現在撰寫引言。
  section:
    system: |
      撰寫最終報告的一個章節。

      規則：
      - 儘可能寫得充實：在證據允許的範圍內展開定義、背景、機制、邊界條件、例子/反例、實踐路徑、風險、取捨和未解問題。不要用幾句概括草草結束。
      - 寫成高密度分析章節：先給出判斷或定義，再展開推理鏈；不要把每個章節都寫成千篇一律的 ``1. 2. 3.`` 清單。
      - 每個章節應以連貫段落為主體，並在合適時使用 Markdown 富文字增強表達：表格用於比較/權衡，bullet points 用於分類/清單，有序列表用於真實步驟，Mermaid 用於流程/架構/因果鏈，LaTeX 公式用於確有必要的數量關系。
      - 富文字要服務理解，不要裝飾性堆砌。通常每節 1-2 個結構化元素已經足夠；如果證據很薄，優先寫清不確定性，不要為了顯得豐富而虛構內容。
      - 只使用下方"證據"塊中的合並知識作為事實來源。每條 ``#### Evidence [CIT-...]`` 都是一個可引用來源，行內引用必須**照抄**證據裡出現過的 ``[CIT-...]`` 記號，**不要憑空編造引用號**。
      - 需要把觀點和引用精確對應：引用應放在被該證據支援的句子末尾，不要把一串引用堆在段末。
      - 如果證據塊裡完全沒有 ``[CIT-...]`` 記號（說明研究階段沒有檢索到外部證據），就用陳述句寫本章節、不要寫任何 ``[CIT-...]``；並在章節末尾加一句"本節缺少外部檢索證據，結論以模型既有知識為基礎"。
      - 保留具體的事實、數字、命名實體 —— 不要含糊化。
      - 不要重複其他章節已覆蓋的內容。
      - **章節內文必須以一行二級標題開頭**：``## {section_number}. <章節標題>``（即本節編號為 {section_number}）。標題只出現一次，絕不要寫成 ``## ## ...``，也不要保留 ``[S1]`` 這類內部編號；數字 ``{section_number}.`` 不可省略。
      - 如需小節，使用形如 ``### {section_number}.1 <小節標題>``、``### {section_number}.2 <小節標題>`` 這種帶本節編號的三級標題；不要跨節編號，不要從 1 重新起。

      首行輸出 ``SECTION``，下面是章節內文（Markdown）。
    user_template: |
      主題：{topic}
      報告標題：{report_title}

      章節 [{section_id}]：{section_title}
      章節編號：{section_number}（即整篇報告的第 {section_number} 節）
      章節意圖：{section_intent}

      本章節可用的證據：

      {evidence}

      現在撰寫本章節。
  conclusion:
    system: |
      撰寫報告的結論。結論要像綜合判斷，而不是簡單摘要。

      寫作要求：
      - 用 4-6 個扎實段落綜合各章節的核心結論，說明它們如何相互支撐或相互制約。
      - 明確回答研究主題下最重要的問題；如果證據不足，要指出哪些結論可靠、哪些仍需驗證。
      - 適合時給出後續研究方向、決策標準、實施建議或風險清單；可以用少量 bullet points，但不要寫成模板化總結。
      - 可以使用簡短表格整理"已知結論 / 證據強度 / 仍待驗證"，但只有在確實能提升可讀性時使用。
      - **結論內文必須以一行二級標題開頭**：``## {section_number}. 結論``（即編號為 {section_number}，標題為"結論"）。標題只出現一次。
      - **結論不要使用任何三級小節標題**（不要出現 ``### {section_number}.1 ...``、``### ...`` 等）。整段結論以連貫段落為主，必要時可用少量 bullet points 或一個簡短表格，但不要切成帶編號的小節。

      首行輸出 ``CONCLUSION``，下面是結論內文（Markdown）。
    user_template: |
      主題：{topic}
      報告標題：{title}

      結論編號：{section_number}（即整篇報告的第 {section_number} 節，也是最後一節）

      章節回顧：

      {sections_recap}

      現在撰寫結論。
